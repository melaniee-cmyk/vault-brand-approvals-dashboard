<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Approvals — The Vault</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
  .page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .header-left h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .header-left p { font-size: 13px; color: #666; }
  .badge { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; background: #e6f7f0; color: #0f6e56; font-size: 11px; padding: 3px 9px; border-radius: 6px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .filter-row select { font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; cursor: pointer; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .metric { background: #fff; border-radius: 8px; padding: 0.9rem 1rem; border: 1px solid #e8e8e8; }
  .metric .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .metric .value { font-size: 22px; font-weight: 600; line-height: 1.1; }
  .metric .sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 1.5rem; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 10px; padding: 1rem 1.25rem; border: 1px solid #e8e8e8; margin-bottom: 0; }
  .card.full { margin-bottom: 1.5rem; }
  .card h3 { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.85rem; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #888; margin-bottom: 8px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .ldot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 13px; }
  .brand-name { width: 110px; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-bg { flex: 1; background: #f0f0f0; border-radius: 3px; height: 8px; }
  .bar { height: 8px; border-radius: 3px; background: #1D9E75; }
  .bcount { width: 28px; text-align: right; color: #888; font-size: 12px; }
  .recent-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .recent-row:last-child { border-bottom: none; }
  .recent-brand { font-weight: 500; }
  .recent-date { color: #888; font-size: 12px; }
  .urgent-tag { display: inline-flex; align-items: center; gap: 3px; background: #fff0ee; color: #c0392b; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 6px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <h1>#the-vault-brand-approvals</h1>
      <p><strong>Source</strong> Slack channel &nbsp;·&nbsp; <strong>Period</strong> Jan 5 – Jun 9, 2026</p>
      <span class="badge">&#10003; Updated Jun 9, 2026</span>
    </div>
  </div>

  <div class="filter-row">
    <select id="monthFilter" onchange="updateDash()">
      <option value="all">All months</option>
      <option value="1">Jan</option>
      <option value="2">Feb</option>
      <option value="3">Mar</option>
      <option value="4">Apr</option>
      <option value="5">May</option>
      <option value="6">Jun</option>
    </select>
    <select id="urgentFilter" onchange="updateDash()">
      <option value="all">All types</option>
      <option value="urgent">Urgent / @here only</option>
    </select>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="card full">
    <h3>Volume over time</h3>
    <div class="legend">
      <span><span class="ldot" style="background:#1D9E75"></span>Monthly submissions</span>
      <span><span class="ldot" style="background:#D85A30"></span>Urgent / @here</span>
    </div>
    <div style="position:relative;height:220px;"><canvas id="chartVolume"></canvas></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Top brands</h3>
      <div id="brandBars"></div>
    </div>
    <div class="card">
      <h3>Recent submissions · live feed</h3>
      <div id="recentList"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Time of day · submission hours ET</h3>
      <div style="position:relative;height:160px;"><canvas id="chartHour"></canvas></div>
    </div>
    <div class="card">
      <h3>Brand mix over time · top 5 by month</h3>
      <div class="legend" id="mixLegend"></div>
      <div style="position:relative;height:160px;"><canvas id="chartMix"></canvas></div>
    </div>
  </div>
</div>

];

const MN = ["","Jan","Feb","Mar","Apr","May","Jun"];
let volChart, hourChart, mixChart;

function getFiltered() {
  const m = document.getElementById('monthFilter').value;
  const u = document.getElementById('urgentFilter').value;
  return RAW.filter(r => {
    if (m !== 'all' && r.m !== parseInt(m)) return false;
    if (u === 'urgent' && r.u !== 1) return false;
    return true;
  });
}

function updateDash() {
  const data = getFiltered();
  const urgentCount = RAW.filter(r => r.u === 1).length;
  const brandSet = new Set(data.map(r => r.b));
  const topBrand = Object.entries(data.reduce((a,r)=>{a[r.b]=(a[r.b]||0)+1;return a;},{})).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="label">Submissions</div><div class="value">${data.length}</div><div class="sub">in selection</div></div>
    <div class="metric"><div class="label">Unique brands</div><div class="value">${brandSet.size}</div><div class="sub">in selection</div></div>
    <div class="metric"><div class="label">Urgent flags</div><div class="value" style="color:#c0392b">${urgentCount}</div><div class="sub">@here escalations</div></div>
    <div class="metric"><div class="label">Top brand</div><div class="value" style="font-size:15px;padding-top:4px">${topBrand?topBrand[0]:'—'}</div><div class="sub">${topBrand?topBrand[1]+' submissions':''}</div></div>
    <div class="metric"><div class="label">Avg / week</div><div class="value">${Math.round(RAW.length/22)}</div><div class="sub">~22 weeks total</div></div>
  `;

  const byMonth = Array(7).fill(null).map(()=>({total:0,urgent:0}));
  RAW.forEach(r=>{byMonth[r.m].total++;if(r.u)byMonth[r.m].urgent++;});
  const months = [1,2,3,4,5,6];
  const selM = document.getElementById('monthFilter').value;

  if (volChart) volChart.destroy();
  volChart = new Chart(document.getElementById('chartVolume'), {
    type:'bar',
    data:{
      labels: months.map(m=>MN[m]),
      datasets:[
        {label:'Submissions',data:months.map(m=>byMonth[m].total),backgroundColor:months.map(m=>selM==='all'||parseInt(selM)===m?'#1D9E75':'rgba(29,158,117,0.2)'),borderRadius:3},
        {label:'Urgent',data:months.map(m=>byMonth[m].urgent),backgroundColor:'#D85A30',borderRadius:3}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:12}}},y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:11}}}}}
  });

  const bc = {};
  data.forEach(r=>{bc[r.b]=(bc[r.b]||0)+1;});
  const top = Object.entries(bc).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const mx = top[0]?top[0][1]:1;
  document.getElementById('brandBars').innerHTML = top.map(([name,cnt])=>`
    <div class="brand-row">
      <div class="brand-name" title="${name}">${name}</div>
      <div class="bar-bg"><div class="bar" style="width:${Math.round(cnt/mx*100)}%"></div></div>
      <div class="bcount">${cnt}</div>
    </div>`).join('');

  const recent = [...RAW].sort((a,b)=>(b.m*100+b.d)-(a.m*100+a.d)).slice(0,8);
  document.getElementById('recentList').innerHTML = recent.map(r=>`
    <div class="recent-row">
      <span class="recent-brand">${r.b}${r.u?'<span class="urgent-tag">urgent</span>':''}</span>
      <span class="recent-date">${MN[r.m]} ${r.d}</span>
    </div>`).join('');

  const hb = Array(24).fill(0);
  RAW.forEach(r=>hb[r.h]++);
  const hrs = Array.from({length:13},(_,i)=>i+7);
  if (hourChart) hourChart.destroy();
  hourChart = new Chart(document.getElementById('chartHour'),{
    type:'bar',
    data:{labels:hrs.map(h=>h+':00'),datasets:[{data:hrs.map(h=>hb[h]),backgroundColor:'#3266AD',borderRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45}},y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:10}}}}}
  });

  const top5 = Object.entries(RAW.reduce((a,r)=>{a[r.b]=(a[r.b]||0)+1;return a;},{})).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const sc = ['#1D9E75','#3266AD','#D85A30','#BA7517','#9E3A8C'];
  if (mixChart) mixChart.destroy();
  mixChart = new Chart(document.getElementById('chartMix'),{
    type:'bar',
    data:{
      labels:months.map(m=>MN[m]),
      datasets:top5.map((b,i)=>({label:b,data:months.map(m=>RAW.filter(r=>r.b===b&&r.m===m).length),backgroundColor:sc[i],borderRadius:2,stack:'s'}))
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:11}},stacked:true},y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:10}},stacked:true}}}
  });

  document.getElementById('mixLegend').innerHTML = top5.map((b,i)=>`<span><span class="ldot" style="background:${sc[i]}"></span>${b}</span>`).join('');
}

updateDash();
</script>
</body>
</html>
